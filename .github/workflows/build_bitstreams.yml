name: Vivado Build

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'boards/**'
      - 'rfsoc_qpsk/**'
      - 'setup.py'
      - 'scripts/ci/**'
      - 'tests/ci/**'
      - '.github/workflows/build_bitstreams.yml'
  workflow_dispatch:

permissions:
  contents: read

# These are upgrade targets, not a declaration of tested board compatibility.
env:
  SOURCE_VIVADO: '2024.1'
  TARGET_VIVADO: '2025.2'
  TARGET_PYNQ: '4.0'

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test migration orchestration
        run: python3 -m unittest discover -s tests/ci -v

  build-bitstream:
    needs: check-scripts
    # Persistent licensed runners only execute branches in this repository.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        board: [RFSoC4x2] # Pilot; expand only after board/image readiness is confirmed.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recreate, upgrade, validate, build and package
        env:
          BOARD: ${{ matrix.board }}
        run: >-
          python3 scripts/ci/upgrade.py
          --design rfsoc_qpsk --board "$BOARD"
          --source-version "$SOURCE_VIVADO" --target-version "$TARGET_VIVADO"
          --pynq-version "$TARGET_PYNQ"
      - name: Save candidate, migration patch and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-${{ matrix.board }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/${{ matrix.board }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
