name: Vivado Build

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'boards/**'
      - 'rfsoc_qpsk/**'
      - 'setup.py'
      - '.github/workflows/upgrade/**'
      - '.github/workflows/build_bitstreams.yml'
  workflow_dispatch:
    inputs:
      board:
        description: Board to build
        type: choice
        options: [RFSoC4x2, RFSoC2x2, ZCU111, ZCU208, ZCU216]
        default: RFSoC4x2
        required: true

permissions:
  contents: read

env:
  TARGET_PYNQ: '4.0'

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test migration orchestration
        run: python3 -m unittest discover -s .github/workflows/upgrade/tests -v

  build-bitstream:
    needs: check-scripts
    # Persistent licensed runners only execute branches in this repository.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        board: ["${{ inputs.board || 'RFSoC4x2' }}"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recreate, build and package
        env:
          BOARD: ${{ matrix.board }}
        run: >-
          python3 .github/workflows/upgrade/upgrade.py
          --design rfsoc_qpsk --board "$BOARD"
          --build-only --pynq-version "$TARGET_PYNQ"
      - name: Save build candidate and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitstream-${{ matrix.board }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/${{ matrix.board }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
