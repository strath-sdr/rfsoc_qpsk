name: Vivado Upgrade

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board to upgrade and build
        type: choice
        options: [RFSoC4x2, RFSoC2x2, ZCU111, ZCU208, ZCU216]
        default: RFSoC4x2
        required: true
      source_version:
        description: Original Vivado version (must match the design Tcl)
        type: string
        default: '2024.1'
        required: true
      target_version:
        description: Target Vivado version
        type: string
        default: '2025.2'
        required: true

permissions:
  contents: read

# These are upgrade targets, not a declaration of tested board compatibility.
env:
  SOURCE_VIVADO: ${{ inputs.source_version || '2024.1' }}
  TARGET_VIVADO: ${{ inputs.target_version || '2025.2' }}
  TARGET_PYNQ: '4.0'

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test migration orchestration
        run: python3 -m unittest discover -s .github/workflows/upgrade/tests -v

  build-bitstream:
    needs: check-scripts
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        board: ["${{ inputs.board || 'RFSoC4x2' }}"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recreate, upgrade, validate, build and package
        env:
          BOARD: ${{ matrix.board }}
        run: >-
          python3 .github/workflows/upgrade/upgrade.py
          --design rfsoc_qpsk --board "$BOARD"
          --source-version "$SOURCE_VIVADO" --target-version "$TARGET_VIVADO"
          --pynq-version "$TARGET_PYNQ"
      - name: Save candidate, migration patch and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-${{ matrix.board }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/${{ matrix.board }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
